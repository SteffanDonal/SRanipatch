name: Build
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    defaults:
      run:
        working-directory: runtime
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            preset: windows-x64
            platform: windows-x64
          - os: ubuntu-24.04-arm
            preset: linux-release
            platform: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch runtime assets
        run: git lfs pull --include="assets/models/lip_model.mnn,runtime/assets/head.glb"
      - name: Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev wayland-protocols extra-cmake-modules
      - run: cmake --preset ${{ matrix.preset }}
      - name: Set release identity
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: cmake --preset '${{ matrix.preset }}' -DSRANIPATCH_RELEASE_VERSION="$RELEASE_TAG"
      - run: cmake --build --preset ${{ matrix.preset }} --parallel 2
      - run: ctest --preset ${{ matrix.preset }}
      - name: Stage applications
        run: cmake --install build/${{ matrix.preset }} --config Release --component Runtime --prefix build/package
      - uses: actions/upload-artifact@v4
        with:
          name: applications-${{ matrix.os }}
          path: runtime/build/package/
      - name: Create release archive
        run: cpack --config build/${{ matrix.preset }}/CPackConfig.cmake -C Release
      - name: Checksum release archives
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          for path in Path('../output').iterdir():
              if path.is_file() and path.name.endswith(('.zip', '.tar.gz')):
                  path.with_name(path.name + '.sha256').write_text(
                      hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + path.name + '\n')
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            output/*.zip
            output/*.tar.gz
            output/*.sha256

  cross:
    defaults:
      run:
        working-directory: runtime
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - run: cmake --preset linux-aarch64
      - run: cmake --build --preset linux-aarch64 --parallel 2

  sanitizers:
    defaults:
      run:
        working-directory: runtime
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake --preset linux-debug -DSRANIPATCH_BUILD_SERVER=OFF -DSRANIPATCH_BUILD_CLIENT=OFF
      - run: cmake --build --preset linux-debug --parallel 2
      - run: ctest --preset linux-debug
