name: Build
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    defaults:
      run:
        working-directory: runtime
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            preset: windows-x64
            package: SRanipatch-Runtime.win-x64
          - os: ubuntu-24.04-arm
            preset: linux-release
            package: SRanipatch-Runtime.linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch runtime assets
        run: git lfs pull --include="assets/models/lip_model.mnn,runtime/assets/head.glb"
      - name: Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev wayland-protocols extra-cmake-modules
      - run: cmake --preset ${{ matrix.preset }}
      - name: Set release identity
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: cmake --preset '${{ matrix.preset }}' -DSRANIPATCH_RELEASE_VERSION="$RELEASE_TAG"
      - run: cmake --build --preset ${{ matrix.preset }} --parallel 2
      - run: ctest --preset ${{ matrix.preset }}
      - name: Create release archive
        run: cpack --config build/${{ matrix.preset }}/CPackConfig.cmake -C Release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          if-no-files-found: error
          path: |
            output/${{ matrix.package }}.*

  receiver:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: benaclejames/VRCFaceTracking
          ref: e3f40dd1fdd5e03a645a32691cbf54b4a99afbdd
          path: upstream-vrcft
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build VRCFaceTracking references
        run: dotnet build upstream-vrcft/VRCFaceTracking.Core/VRCFaceTracking.Core.csproj -c Release -o "${{ runner.temp }}/vrcft-references"
      - name: Package Receiver
        run: dotnet publish receiver/SRanipatch/SRanipatch.csproj -c Release -p:VrcftDirectory="${{ runner.temp }}/vrcft-references"
      - uses: actions/upload-artifact@v4
        with:
          name: SRanipatch.VRCFT.win-x64
          if-no-files-found: error
          path: output/SRanipatch.VRCFT.win-x64.zip

  cross:
    defaults:
      run:
        working-directory: runtime
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - run: cmake --preset linux-aarch64
      - run: cmake --build --preset linux-aarch64 --parallel 2

  sanitizers:
    defaults:
      run:
        working-directory: runtime
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake --preset linux-debug -DSRANIPATCH_BUILD_SERVER=OFF -DSRANIPATCH_BUILD_CLIENT=OFF
      - run: cmake --build --preset linux-debug --parallel 2
      - run: ctest --preset linux-debug
